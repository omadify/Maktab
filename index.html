<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Norin tuman ixtisoslashtirilgan maktabi — 26-AF buyruq asosidagi pedagoglar reyting va samaradorlik tahlili platformasi.">
  <meta name="theme-color" content="#F8FAFC" id="meta-theme-color">
  <title>Pedagog Reyting — Norin tuman ixtisoslashtirilgan maktabi</title>
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('reyting_theme') || 'system';
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var resolved = saved === 'system' ? (prefersDark ? 'dark' : 'light') : saved;
        document.documentElement.setAttribute('data-theme', resolved);
        document.documentElement.setAttribute('data-theme-pref', saved);
        document.documentElement.style.colorScheme = resolved;
        var meta = document.getElementById('meta-theme-color');
        if (meta) meta.setAttribute('content', resolved === 'dark' ? '#0B1120' : '#F8FAFC');
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="style.css">
  <!-- SheetJS for lightweight in-browser Excel (.xlsx) parsing without server burden -->
  <script defer src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite" aria-atomic="true"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
